services:
  postgres:
    image: postgres:13
    container_name: postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: weather_etl_data

    ports:
      - "5432:5432"

    volumes:
      - weather_etl_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d weather_etl_data"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  weather_etl_data:

